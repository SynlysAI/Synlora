[project]
name = "synlys-harness"
version = "0.1.0"
description = "SynlysAgent 核心 Agent 运行时（纯 Python，无 Web 依赖）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "openai>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# python.run 容器沙箱（sandbox_mode=docker 时需要；local 模式零依赖）
docker = [
    "docker>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# 内置技能种子（resources 不是包，无 __init__.py，必须显式声明随包安装，
# 否则正式安装后 SkillService.seed_builtins 找不到 src 树）。
[tool.setuptools.package-data]
synlys_harness = [
    "resources/skills/**/*",
    "resources/skills/*/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
