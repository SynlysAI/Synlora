[project]
name = "synlys-harness"
version = "0.2.0"
description = "SynlysAgent 核心 Agent 运行时（纯 Python，无 Web 依赖）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "openai>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# python.run 容器沙箱（sandbox_mode=docker 时需要；local 模式零依赖）
docker = [
    "docker>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
