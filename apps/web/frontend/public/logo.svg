<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sGrad" x1="120" y1="90" x2="405" y2="425" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24282E"/>
      <stop offset="1" stop-color="#575E68"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B7280"/>
      <stop offset="1" stop-color="#4A5058"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/>
    </filter>
  </defs>

  <!-- Soft app tile -->
  <rect x="38" y="38" width="436" height="436" rx="104"
        fill="#FFFFFF" stroke="#E3E6EB" stroke-width="4"/>

  <!-- Stylized S / scientific ribbon -->
  <path d="M365 151
           C322 118 263 105 207 125
           C153 144 126 190 143 231
           C159 270 201 283 252 298
           C297 311 322 323 319 348
           C316 375 280 391 241 390
           C215 389 190 381 166 367
           L145 402
           C178 425 220 438 265 437
           C334 436 390 397 400 348
           C412 291 366 263 300 243
           C254 229 218 217 220 195
           C222 173 252 160 282 159
           C307 158 331 164 350 179
           Z"
        fill="url(#sGrad)" filter="url(#shadow)"/>

  <!-- Molecular connection, upper-right -->
  <path d="M332 224 L382 179" stroke="#7A818B" stroke-width="13"
        stroke-linecap="round"/>
  <circle cx="328" cy="227" r="24" fill="#4A5058"/>
  <circle cx="397" cy="164" r="34" fill="url(#nodeGrad)"/>

  <!-- Molecular connection, lower-left -->
  <path d="M171 343 L119 386" stroke="#8A919B" stroke-width="13"
        stroke-linecap="round"/>
  <circle cx="174" cy="341" r="22" fill="#575E68"/>
  <circle cx="104" cy="398" r="34" fill="url(#nodeGrad)"/>
</svg>
